# --- Metadados do Projeto ---
project:
  name: "Precificacao_Imoveis_Ribeirao"
  version: "1.2.0"
  description: "Modelo de precificação de apartamentos utilizando dados de portais imobiliários."

# --- Configurações de Dados ---
data:
  input_path: "data/processed.csv"       # Onde o CSV limpo está
  test_size: 0.20                        # 20% para teste (A Prova)
  random_state: 42                       # Semente para garantir repetibilidade
  target_column: "precos"                # O que queremos prever

# --- Configuração do Modelo ---
model:

  parametros_treinamento_simples:

    random_forest: # 1
      random_state: 42
      min_samples_leaf: 1
      min_samples_split: 5
      criterion: friedman_mse
      ccp_alpha: 0.0
      max_features: log2
      max_depth: 30

    arvore_decisao: #2
      random_state: 42
      min_samples_leaf: 2
      min_samples_split: 10
      criterion: squared_error
      ccp_alpha: 0.0
      max_depth: null
      max_features: null
      max_leaf_nodes: null

    regressao_svr: #3
      kernel: rbf
      C: 50
      gamma: scale
      epsilon: 0.05

    regressao_rede_neural: #4
      hidden_layer_sizes: [ 100, 50 ]
      alpha: 0.01
      activation: relu
      solver: adam
      max_iter: 1000
      early_stopping: true
      n_iter_no_change: 20
      validation_fraction: 0.1
      random_state: 42
      learning_rate_init: 0.0005
      tol: 0.0001


    regressao_xgboost: #5
      objective: reg:squarederror
      booster: gbtree                 # gbtree | gblinear | dart
      n_estimators: 400
      learning_rate: 0.05
      random_state: 42
      n_jobs: -1
      verbosity: 1

      # -------------------------------
      # Complexidade da árvore
      # -------------------------------
      max_depth: 6
      max_leaves: 0
      min_child_weight: 5
      max_delta_step: 0
      grow_policy: depthwise           # depthwise | lossguide

      # -------------------------------
      # Regularização
      # -------------------------------
      reg_alpha: 0.0
      reg_lambda: 1.0
      gamma: 0.0

      # -------------------------------
      # Amostragem (reduz overfitting)
      # -------------------------------
      subsample: 0.8
      colsample_bytree: 0.8
      colsample_bylevel: 1.0
      colsample_bynode: 1.0

      # -------------------------------
      # Treinamento / Avaliação
      # -------------------------------
      eval_metric: rmse
      early_stopping_rounds: null
      callbacks: null

      # -------------------------------
      # Performance / Otimização
      # -------------------------------
      tree_method: auto
      max_bin: 256
      predictor: auto
      sampling_method: uniform

      # -------------------------------
      # Dados e comportamento
      # -------------------------------
      missing: null
      base_score: null
      importance_type: gain
      enable_categorical: false

      # -------------------------------
      # Restrições avançadas
      # -------------------------------
      monotone_constraints: null
      interaction_constraints: null

      # -------------------------------
      # Parâmetros exclusivos do DART
      # (só se booster = dart)
      # -------------------------------
    #      dart:
    #        sample_type: uniform
    #        normalize_type: tree
    #        rate_drop: 0.0
    #        skip_drop: 0.0
    regressao_linear: # 6
      fit_intercept: True
      positive: False


    regressao_linear_ridge: #7
      alpha: 1.0
      fit_intercept: True
      solver: auto
      positive: False
      tol: 0.003
      random_state: 42
      copy_X: True

    regressao_linear_lasso: #8
      alpha: 0.1
      fit_intercept: True
      max_iter: 1000
      tol: 0.0004
      random_state: 42

    regressao_linear_elastic_net:
      alpha: 1.0
      l1_ratio: 0.5
      fit_intercept: True
      max_iter: 10_000
      positive: False
      random_state: 42


    regressao_polinomial: #9
      degree: 2
      interaction_only: False
      include_bias: False








  parametros_grid:
    modelo_xgboost: #0
      # Complexidade da árvore
      max_depth: [ 3, 5, 7, 10 ]
      min_child_weight: [ 1, 3, 5 ]

      # Taxa de aprendizado vs número de árvores
      learning_rate: [ 0.01, 0.05, 0.1 ]
      n_estimators: [ 200, 500, 800 ]

      # Subamostragem (regularização)
      subsample: [ 0.7, 0.8, 1.0 ]
      colsample_bytree: [ 0.7, 0.8, 1.0 ]

      # Regularização
      gamma: [ 0, 0.1, 0.3 ]
      reg_alpha: [ 0, 0.1, 1 ]    # L1
      reg_lambda: [ 1, 1.5, 2 ]      # L2

    modelo_arvore_decisao: #1
      regressor__max_depth: [ null, 5, 8, 12, 20 ]
      regressor__min_samples_split: [ 10, 20, 40 ]
      regressor__min_samples_leaf: [ 2, 5, 10 ]
      regressor__max_leaf_nodes: [ null, 20, 50, 100 ]
      regressor__criterion: [ "squared_error", "friedman_mse" ]
      regressor__max_features: [ null, "sqrt", "log2" ]
      regressor__ccp_alpha: [ 0.0, 0.001, 0.01 ]


    modelo_rede_neural: #2
      regressor__regressor__hidden_layer_sizes: [ [ 6,6 ], [ 10 ], [ 20 ], [ 50 ], [ 50,25 ], [ 50,50 ], [ 100 ], [ 100,50 ] ]
      regressor__regressor__solver: [ "adam" ]
      regressor__regressor__activation: [ "relu", "tanh" ]
      regressor__regressor__alpha: [ 0.0001, 0.001, 0.01 ]
      regressor__regressor__learning_rate_init: [ 0.0005, 0.001 ]
      regressor__regressor__max_iter: [ 1000, 2000 ]
      regressor__regressor__early_stopping: [ true ]
      regressor__regressor__n_iter_no_change: [ 20 ]
      regressor__regressor__tol: [ 0.0001 ]

    modelo_svr: #3
      regressor__kernel: [ "rbf" ]
      regressor__C: [ 1, 5, 10, 50 ]
      regressor__gamma: [ "scale", 0.01, 0.001 ]
      regressor__epsilon: [ 0.05, 0.1 ]

    modelo_random_florest: #4
      regressor__max_depth: [ null, 5, 10, 20, 30 ]
      regressor__min_samples_split: [ 2, 5, 10 ]
      regressor__min_samples_leaf: [ 1, 2, 5 ]
      regressor__max_features: [ null, "sqrt", "log2" ]
      regressor__criterion: [ "squared_error", "friedman_mse" ]
      regressor__ccp_alpha: [ 0.0, 0.001, 0.01 ]


    modelo_regressao_linear: #5
      regressor__fit_intercept': [ True, False ]
      regressor__positive': [ True, False ]

    modelo_regressao_linear_ridge: #6
      regressor__alpha: [ 0.01, 0.1, 1.0, 10.0, 100.0 ]
      regressor__fit_intercept': [ True, False ]
      regressor__tol: [ 0.0001, 0.001, 0.01, 0.1 ]
      regressor__solver: [ 'auto', 'svd', 'cholesky', 'saga' ]
      positive: [ True, False ]
      copy_X: [ True, False ]

    modelo_regressao_linear_lasso: #7
      regressor__alpha': [ 0.001, 0.01, 0.1, 1.0, 10.0 ]
      regessor_fit_intercept: [ True, False ]
      max_iter: [ 500.0, 1000.0, 5000.0, 10000.0 ]
      tol: [ 0.0001, 0.001, 0.01, 0.1 ]
      positive: [ True, False ]

    modelo_regressao_linear_elasticnet: #8
      regressor__alpha: [ 0.01, 0.1, 0.5, 1.0, 5.0 ]
      regressor__l1_ratio: [ 0.1, 0.3, 0.5, 0.7, 0.9 ]
      regressor__fit_intercept: [ True, False ]
      regressor__max_ite: [ 1000.0, 5000.0, 10000.0 ]
      regressor__tol: [ 0.0001, 0.001, 0.01 ]
      regressor__positive: [ True, False ]
      random_state: [ 42.0 ]

    modelo_regressao_polinomial: #9
      regressor_degree: [ 2.0, 3.0, 4.0, 5.0 ],
      regressor_interaction_only': [ False, True ]
      regressor_include_bias': [ False, True ]

  param_grid_regressao_polinomial:
    modelo_regressao_linear: #0
      poly__degree: [ 2.0, 3.0 ],
      poly__interaction_only: [ False, True ]
      regressor__fit_intercept: [ True, False ]

    modelo_regressao_linear_elasticnet: #1
      poly__degree: [ 2.0, 3.0 ]
      poly__interaction_only: [ False, True ]
      regressor__alpha: [ 0.01, 0.1, 0.5 ]
      regressor__l1_ratio: [ 0.3, 0.5, 0.7 ]
      regressor__fit_intercept: [ True, False ]
      regressor__tol: [ 0.0001, 0.001 ]

    modelo_regressao_linear_lasso: #2
      poly__degree: [ 2.0, 3.0 ]
      poly__interaction_only: [ False, True ]
      regressor__alpha: [ 0.01, 0.1, 0.5 ]
      regressor__fit_intercept: [ True, False ]
      regressor__tol: [ 0.0001, 0.001 ]

  parametros_producao:
    random_forest:
      random_state: 42
      min_samples_leaf: 1
      min_samples_split: 5
      criterion: squared_error
      ccp_alpha: 0.0
      max_features: log2

    arvore_decisao:
      random_state: 42
      min_samples_leaf: 2
      min_samples_split: 20
      criterion: squared_error
      ccp_alpha: 0.0
      max_depth: null
      max_features: null
      max_leaf_nodes: null

    regressao_svr:
      kernel: rbf
      C: 5
      gamma: scale
      epsilon: 0.1

      regressao_rede_neural:
        hidden_layer_sizes: [ 50, 25 ]
        alpha: 0.0001,
        activation: relu
        solver: adam
        max_iter: 1000
        early_stopping: true
        n_iter_no_change: 20
        validation_fraction: 0.1
        random_state: 42
        verbose: true
        learning_rate_init: 0.001
        tol: 0.0001


    regressao_xgboost:
      objective: reg:squarederror
      booster: gbtree                 # gbtree | gblinear | dart
      n_estimators: 400
      learning_rate: 0.05
      random_state: 42
      n_jobs: -1
      verbosity: 1

      # -------------------------------
      # Complexidade da árvore
      # -------------------------------
      max_depth: 6
      max_leaves: 0
      min_child_weight: 5
      max_delta_step: 0
      grow_policy: depthwise           # depthwise | lossguide

      # -------------------------------
      # Regularização
      # -------------------------------
      reg_alpha: 0.0
      reg_lambda: 1.0
      gamma: 0.0

      # -------------------------------
      # Amostragem (reduz overfitting)
      # -------------------------------
      subsample: 0.8
      colsample_bytree: 0.8
      colsample_bylevel: 1.0
      colsample_bynode: 1.0

      # -------------------------------
      # Treinamento / Avaliação
      # -------------------------------
      eval_metric: rmse
      early_stopping_rounds: null
      callbacks: null

      # -------------------------------
      # Performance / Otimização
      # -------------------------------
      tree_method: auto
      max_bin: 256
      predictor: auto
      sampling_method: uniform

      # -------------------------------
      # Dados e comportamento
      # -------------------------------
      missing: null
      base_score: null
      importance_type: gain
      enable_categorical: false

      # -------------------------------
      # Restrições avançadas
      # -------------------------------
      monotone_constraints: null
      interaction_constraints: null

      # -------------------------------
      # Parâmetros exclusivos do DART
      # (só se booster = dart)
      # -------------------------------
    #      dart:
    #        sample_type: uniform
    #        normalize_type: tree
    #        rate_drop: 0.0
    #        skip_drop: 0.0

  regressao_linear_ridge: #7


  regressao_linear_lasso: #8

  regressao_linear_elastic_net:
