# --- Metadados do Projeto ---
project:
  name: "Precificacao_Imoveis_Ribeirao"
  version: "1.2.0"
  description: "Modelo de precificação de apartamentos utilizando dados de portais imobiliários."

# --- Configurações de Dados ---
data:
  input_path: "data/processed.csv"       # Onde o CSV limpo está
  test_size: 0.20                        # 20% para teste (A Prova)
  random_state: 42                       # Semente para garantir repetibilidade
  target_column: "precos"                # O que queremos prever

# --- Configuração do Modelo ---
model:

  parametros_treinamento_simples:

    random_forest:
      random_state: 42
      min_samples_leaf: 1
      min_samples_split: 10
      criterion: friedman_mse
      ccp_alpha: 0.001
      max_features: null
      max_depth: 30
      n_jobs: 1

    arvore_decisao:
      random_state: 42
      min_samples_leaf: 2
      min_samples_split: 10
      criterion: friedman_mse
      ccp_alpha: 0.01
      max_depth: 20
      max_features: null
      max_leaf_nodes: null

    regressao_svr:
      kernel: rbf
      C: 150
      gamma: scale
      epsilon: 0.05

    regressao_rede_neural:
      hidden_layer_sizes: [100, 50]
      alpha: 0.0001
      activation: relu
      solver: adam
      max_iter: 2000
      early_stopping: true
      n_iter_no_change: 20
      validation_fraction: 0.1
      random_state: 42
      learning_rate_init: 0.001
      tol: 0.0001

    regressao_xgboost:
      objective: reg:squarederror
      booster: gbtree
      n_estimators: 400
      learning_rate: 0.05
      random_state: 42
      n_jobs: -1
      verbosity: 1
      max_depth: 6
      max_leaves: 0
      min_child_weight: 5
      max_delta_step: 0
      grow_policy: depthwise
      reg_alpha: 0.0
      reg_lambda: 1.0
      gamma: 0.0
      subsample: 0.8
      colsample_bytree: 0.8
      colsample_bylevel: 1.0
      colsample_bynode: 1.0
      eval_metric: rmse
      early_stopping_rounds: null
      callbacks: null
      tree_method: auto
      max_bin: 256
      predictor: auto
      sampling_method: uniform
      missing: null
      base_score: null
      importance_type: gain
      enable_categorical: false
      monotone_constraints: null
      interaction_constraints: null

    regressao_linear:
      fit_intercept: False
      positive: True
      copy_X : True
      n_jobs: null

    regressao_linear_ridge:
      alpha: 1.0
      fit_intercept: True
      max_iter: 5000
      tol: 0.001
      random_state: 42


    regressao_linear_lasso:
      fit_intercept: True
      max_iter: 5000
      tol: 0.001
      random_state: 42


    regressao_linear_elastic_net:
      alpha: 0.01
      fit_intercept: True
      max_iter: 5000
      tol: 0.001

    regressao_polinomial:
      degree: 2
      interaction_only: False
      include_bias: False

  parametros_grid:
    modelo_xgboost:
      max_depth: [3, 5, 7, 10]
      min_child_weight: [1, 3, 5]
      learning_rate: [0.01, 0.05, 0.1]
      n_estimators: [200, 500, 800]
      subsample: [0.7, 0.8, 1.0]
      colsample_bytree: [0.7, 0.8, 1.0]
      gamma: [0, 0.1, 0.3]
      reg_alpha: [0, 0.1, 1]
      reg_lambda: [1, 1.5, 2]

    modelo_arvore_decisao:
      regressor__max_depth: [null, 5, 8, 12, 20]
      regressor__min_samples_split: [10, 20, 40]
      regressor__min_samples_leaf: [2, 5, 10]
      regressor__max_leaf_nodes: [null, 20, 50, 100]
      regressor__criterion: ["squared_error", "friedman_mse"]
      regressor__max_features: [null, "sqrt", "log2"]
      regressor__ccp_alpha: [0.0, 0.001, 0.01]

    modelo_rede_neural:
      regressor__regressor__hidden_layer_sizes: [[6,6], [10], [20], [50], [50,25], [50,50], [100], [100,50]]
      regressor__regressor__solver: ["adam"]
      regressor__regressor__activation: ["relu", "tanh"]
      regressor__regressor__alpha: [0.0001, 0.001, 0.01]
      regressor__regressor__learning_rate_init: [0.0005, 0.001]
      regressor__regressor__max_iter: [1000, 2000]
      regressor__regressor__early_stopping: [true]
      regressor__regressor__n_iter_no_change: [20]
      regressor__regressor__tol: [0.0001]

    modelo_svr:
      regressor__kernel: ["rbf"]
      regressor__C: [1, 5, 10, 50, 100, 150]
      regressor__gamma: ["scale", 0.01, 0.001, 0.0001]
      regressor__epsilon: [0.05, 0.1]

    modelo_random_florest:
      regressor__max_depth: [null, 5, 10, 20, 30]
      regressor__min_samples_split: [2, 5, 10]
      regressor__min_samples_leaf: [1, 2, 5]
      regressor__max_features: [null, "sqrt", "log2"]
      regressor__criterion: ["squared_error", "friedman_mse"]
      regressor__ccp_alpha: [0.0, 0.001, 0.01]

    modelo_regressao_linear:
      regressor__fit_intercept: [true, false]
      regressor__positive: [true, false]
      regressor__copy_X: [true]
      regressor__n_jobs: [null]

    modelo_regressao_linear_ridge:
      regressor__alpha: [ 0.1, 1.0, 10.0, 100.0 ]
      regressor__fit_intercept: [ True ]
      regressor__solver: [ 'auto', 'cholesky' ]

    modelo_regressao_linear_lasso:
      regressor__alpha: [ 0.01, 0.1, 1.0 ]
      regressor__fit_intercept: [ True ]
      regressor__max_iter: [ 5000 ]
      regressor__tol: [ 0.001 ]

    modelo_regressao_linear_elasticnet:
      regressor__alpha: [ 0.1, 1.0, 10.0 ]
      regressor__l1_ratio: [ 0.2, 0.5, 0.8 ]
      regressor__fit_intercept: [ True ]
      regressor__max_iter: [ 5000 ]
      regressor__tol: [ 0.001 ]
      regressor__random_state: [ 42 ]

    modelo_regressao_polinomial:
      regressor_degree: [2.0, 3.0, 4.0, 5.0]
      regressor_interaction_only: [False, True]
      regressor_include_bias: [False, True]

  param_grid_regressao_polinomial:
    modelo_regressao_linear:
      poly__degree: [2, 3]
      poly__interaction_only: [False, True]
      regressor__fit_intercept: [True, False]

    modelo_regressao_linear_elasticnet:
      poly__degree: [2, 3]
      poly__interaction_only: [False, True]
      regressor__alpha: [0.01, 0.1, 0.5]
      regressor__l1_ratio: [0.3, 0.5, 0.7]
      regressor__fit_intercept: [True, False]
      regressor__tol: [0.0001, 0.001]

    modelo_regressao_linear_lasso:
      poly__degree: [2, 3]
      poly__interaction_only: [False, True]
      regressor__alpha: [0.01, 0.1, 0.5]
      regressor__fit_intercept: [True, False]
      regressor__tol: [0.0001, 0.001]

    modelo_regressao_linear_ridge:
      poly__degree: [1, 2, 3]
      poly__interaction_only: [False, True]
      regressor__alpha: [0.01, 0.1, 1.0, 10.0]
      regressor__fit_intercept: [True, False]
      regressor__tol: [0.0001, 0.001, 0.01]
